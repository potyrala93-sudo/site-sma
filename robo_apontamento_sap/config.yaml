# ===========================================================================
# Configuração do robô de apontamento ZFLPP005
# Itens marcados com  # CONFIRMAR  precisam ser ajustados antes do uso real.
# ===========================================================================

modo: imagem         # imagem (padrão, sem IDs) | scripting (GUI Scripting) | auto (scripting, senão imagem)
simulacao: true      # true = dry-run: faz tudo MENOS o check verde e o Salvar Guia.
                     # Para gravar de verdade: simulacao: false  ou  python main.py --real

execucao:
  linha_inicial: null          # ex.: 2  (ou use --linhas 2-10)
  linha_final: null            # ex.: 10
  tentativas: 2                # retentativas só para falhas transitórias (timeout, COM)
  pausa_entre_tentativas: 3    # segundos
  ignorar_status: ["OK", "APONTADO", "VERIFICAR"]   # STATUS que começam com isso não são reprocessados
  texto_status_ok: "Apontado"
  regra_insumo: apontar        # apontar (Qtd. Cons na grade de materiais) | pular  # escrito na coluna STATUS quando o Status Reg fica "Criado"
  pular_se_ja_criado: true     # se a linha do SAP já estiver "Criado", não aponta de novo
  atualizar_planilha_em_simulacao: false

planilha:
  modo: csv                    # csv (link público; STATUS gravado pelo Apps Script) | api (conta de serviço)
  id: "1LfeQc6hKUXOGqR2sJfqmNilrvNghozRVFiL_i9jA68c"
  gid: 0
  credenciais: credentials.json
  linha_cabecalho: 1
  renderizacao: FORMATTED_VALUE   # FORMATTED_VALUE (como aparece) | UNFORMATTED_VALUE (números/seriais)
  colunas:                     # letras das colunas
    os: "A"                    # O.S
    servico: "E"               # NI OPERAÇÃO
    quantidade: "F"            # ÁREA REAL
    data: "G"                  # DATA FIM
    insumo: ["H", "K", "N", "Q"]   # INS1..INS4: qualquer um preenchido = tem insumo
    insumos:                   # pares [NI do insumo, quantidade] — casados pelo Material no SAP
      - ["I", "J"]
      - ["L", "M"]
      - ["O", "P"]
      - ["R", "S"]
    status: auto               # auto = procura o cabeçalho "STATUS" (coluna T)
  valores_com_insumo: ["SIM", "S", "X", "TRUE", "VERDADEIRO", "1", "COM INSUMO"]

nuvem:                         # STATUS na planilha + prints no Drive (apps_script/Codigo.gs)
  apps_script_url: ""          # opcional (para salvar prints no Drive). Vazio = STATUS direto na planilha
  token: "lMCRBIunTexwHLCIo3Ytjv76"   # o mesmo valor da constante TOKEN no Codigo.gs
  pasta_drive: "APONTAMENTO SAP"   # dentro dela: uma pasta por O.S. com os prints
  pasta_prints: prints         # cópia local dos prints
  navegador: msedge            # sem Apps Script: STATUS gravado pelo Edge invisível (planilha editável pelo link)

sap:
  saplogon_exe: "C:/Program Files (x86)/SAP/FrontEnd/SAPgui/saplogon.exe"   # CONFIRMAR caminho
  conexao_descricao: null      # nome da entrada no SAP Logon; só usado se não houver conexão aberta
  indice_conexao: 0
  indice_sessao: 0
  transacao: ZFLPP005
  timeout_padrao: 60           # espera máxima de session.Busy (s)
  timeout_abrir_saplogon: 90
  timeout_login: 300           # tempo para você fazer login manualmente
  timeout_popup: 15
  timeout_status_criado: 30
  status_criado: "Criado"

selecao:
  nucleo: "*"
  centro: "*"
  fornecedor: "10003396"
  lote_de: "0"
  lote_ate: "0"
  max_registros: "1000"
  nao_preencher: [fornecedor, max_registros]   # já vêm preenchidos no SAP (10003396 e 1.000): o robô não mexe
  formato_data: "%d%m%Y"       # digitado sem pontos (01102026); o SAP formata sozinho
  periodo:                     # Data planejada de/até
    modo: mes_atual            # mes_atual | mes_da_execucao (mês da coluna G) | fixo
    data_inicial: "01/10/2026" # [DATA_INICIAL] — só no modo fixo
    data_final: "31/10/2026"   # [DATA_FINAL]   — só no modo fixo

apontamento:
  formato_data_execucao: "%d%m%Y"   # 01/10/2026 -> 01102026
  casas_decimais: 3                 # 45.62 -> 45,620

relatorio:
  pasta: relatorios

logs:
  pasta: logs
  nivel: INFO                  # no arquivo de log sempre vai DEBUG

# ---------------------------------------------------------------------------
# MODO IMAGEM (padrão). Imagens em /imagens recortadas dos prints reais
# (Windows com escala 125%, SAP maximizado). dx/dy = distância em pixels do
# CENTRO da imagem até o ponto de clique. Já medidos — só mude se a tela mudar.
# ---------------------------------------------------------------------------
imagem:
  pasta: imagens
  confidence: 0.9              # 0.8–0.95; baixe se não encontrar, suba se confundir
  timeout: 15                  # espera máxima por cada tela/imagem (s)
  pausa_entre_acoes: 0.15
  maximizar: true
  titulo_janela_sap: '\\Remote$'  # SAP pelo Citrix: janela "<tela> - \\Remote"
  dx_campo_comando: 93         # do ícone verde de Enter até o campo de comando
  exigir_leitura_servico: true # false = não valida o Serviço se o Ctrl+C não funcionar
  limiar_checkbox: 12
  timeout_abrir_janela: 30     # espera o Citrix redesenhar o SAP (ex.: estava minimizado)
  confianca:                   # ícones pequenos variam no Citrix: exigência menor, área limitada
    icone_enter: 0.7
  preferir_esquerda: [col_material]   # "Material" também aparece em "Descrição do Material"
  regiao_busca:                # [esquerda, topo, largura, altura] em pixels
    icone_enter: [0, 0, 400, 160]
  campos:
    ordem_servico:  {imagem: rotulo_ordem_servico,  dx: 192, dy: 0}
    nucleo:         {imagem: rotulo_nucleo,         dx: 192, dy: 0}
    centro:         {imagem: rotulo_centro,         dx: 192, dy: 0}
    fornecedor:     {imagem: rotulo_fornecedor,     dx: 192, dy: 0}
    lote_de:        {imagem: rotulo_lote_controle,  dx: 192, dy: 0}
    lote_ate:       {imagem: rotulo_lote_controle,  dx: 442, dy: 0}
    data_de:        {imagem: rotulo_data_planejada, dx: 192, dy: 0}
    data_ate:       {imagem: rotulo_data_planejada, dx: 442, dy: 0}
    max_registros:  {imagem: rotulo_max_registros,  dx: 192, dy: 0}
    data_execucao:        {imagem: rotulo_data_execucao,      dx: 177, dy: 0}
    quantidade_executada: {imagem: rotulo_qtd_executada,      dx: 194, dy: 0}
    confirmacao_final:    {imagem: chk_confirmacao_final_off, dx: -63, dy: 0}
  grade:
    dy_primeira_linha: 23      # do cabeçalho da coluna até a 1ª linha
    altura_linha: 23
    max_linhas: 15
    dx_coluna:
      maq_evento: -32          # o ícone fica à esquerda do texto do cabeçalho
      material: 0
